management:
  server:
    port: 8081
  endpoint:
    health:
      enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  datasource:
    url: jdbc:h2:file:./echo;DB_CLOSE_ON_EXIT=FALSE;
    name: "yolo"
  batch:
    jdbc:
      initialize-schema: always
    job:
      name: sync
      enabled: true

